[project]
name = "arcsim"
version = "0.1.0"
description = "Planar OpenFOAM, Elmer and preCICE model of a switching arc in a low-voltage circuit breaker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "meshio>=5.3.5",
    "numpy>=2.5.3",
    "pyprecice>=3.4.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arcsim"
module-root = "src"
